<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Alimayu Studio</title>
  <meta name="description" content="Request Dr. Allison Alimayu for a keynote, workshop, training, or panel.">
  <link rel="icon" href="alimayu-seal.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #1E2346;
      --gold: #B08D57;
      --cream: #EFE8DA;
      --ink: #171717;
      --muted: #4A4F63;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--cream);
      color: var(--ink);
      font-family: 'Source Sans 3', sans-serif;
      font-size: 18px;
      line-height: 1.6;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 48px 16px;
    }
    main {
      width: 100%;
      max-width: 640px;
      background: #FFFFFF;
      border: 1px solid rgba(176, 141, 87, .35);
      border-top: 5px solid var(--navy);
      box-shadow: 0 18px 50px rgba(30, 35, 70, .10);
      padding: 48px 40px;
      text-align: center;
    }
    .seal { width: 140px; height: auto; }
    h1 {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-weight: 600;
      font-size: 44px;
      line-height: 1.1;
      color: var(--navy);
      margin: 20px 0 6px;
    }
    .star { color: var(--gold); font-size: 14px; }
    p { color: var(--muted); margin: 18px auto 0; max-width: 46ch; }
    .button {
      display: inline-block;
      margin-top: 30px;
      padding: 15px 36px;
      background: var(--navy);
      color: #E7DBC5;
      font-weight: 600;
      text-decoration: none;
      border-radius: 2px;
      transition: background .2s ease;
    }
    .button:hover, .button:focus-visible { background: var(--gold); color: #FFFFFF; }
    .contact { font-size: 15px; margin-top: 28px; }
    .contact a { color: var(--navy); }
    @media (max-width: 600px) {
      main { padding: 36px 20px; }
      h1 { font-size: 34px; }
      .button { width: 100%; }
    }
  </style>
</head>
<body>
  <main>
    <img class="seal" src="alimayu-seal.png" alt="Alimayu Studio seal">
    <h1>Alimayu Studio</h1>
    <div class="star" aria-hidden="true">&#10022;</div>
    <p>Request Dr. Allison Alimayu for a keynote, workshop, training, or panel. Pia, the Alimayu Studio assistant, walks event organizers through each detail, and a response follows within two business days.</p>
    <a class="button" href="https://agent.jotform.com/01a0c235f070700082ffa4bbe5702f0b80e3">Request a speaking engagement</a>
    <p class="contact">Other questions: <a href="mailto:info@alimayu.studio">info@alimayu.studio</a></p>
  </main>

  <!-- Pia chat bubble (Jotform AI Agent). Keep this line just above the closing body tag on every page. -->
  <script src='https://cdn.jotfor.ms/agent/embedjs/01a0c235f070700082ffa4bbe5702f0b80e3/embed.js'></script>
</body>
</html>
