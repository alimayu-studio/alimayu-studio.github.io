<style>
:root {
--navy: #1E2346;
--gold: #B08D57;
--cream: #EFE8DA;
--ink: #171717;
--muted: #4A4F63;
}
* { box-sizing: border-box; }
body {
margin: 0;
min-height: 100vh;
background: var(--cream);
color: var(--ink);
font-family: 'Source Sans 3', sans-serif;

line-height: 1.6;
}
.topbar {
display: flex;

gap: 10px;
max-width: 960px;
margin: 0 auto;

}
.topbar img { width: 36px; height: auto; }
.topbar span.brand {

font-weight: 600;

color: var(--navy);
}
.nav {
margin-left: auto;

max-width: 760px;
margin: 24px auto 64px;

}

font-weight: 600;
font-size: 52px;
line-height: 1.1;
color: var(--navy);
margin: 0 0 6px;
}
.star { color: var(--gold); font-size: 14px; }
p { color: var(--muted); margin: 18px auto 0; max-width: 48ch; }
.button {
display: inline-block;
margin-top: 30px;
padding: 15px 36px;
background: var(--navy);
color: #E7DBC5;
font-weight: 600;
text-decoration: none;
border-radius: 2px;
transition: background .2s ease;
}
.button:hover, .button:focus-visible { background: var(--gold); color: #FFFFFF; }
.contact { font-size: 15px; margin-top: 28px; }
.contact a { color: var(--navy); }
@media (max-width: 600px) {
h1 { font-size: 38px; }
.button { width: 100%; }
.nav { gap: 16px; }
